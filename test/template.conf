// This is a global configuration for my C project template
name = "MyAwesomeProject"
tempauthor = "John Doe"
version = "1.0.4"

// Define valid directories. The parser will enforce these!
folders = "src include build tests"

// --- File Definitions ---

#main.c
under=src
mode=644
data=[
#include <stdio.h>
#include "config.h"

int main() {
    printf("Welcome to ${name} v${version}!\n");
    printf("Author: ${tempauthor}\n");
    return 0;
}
]

#config.h
under=include
data=[
#ifndef CONFIG_H
#define CONFIG_H

#define APP_NAME "${name}"
#define APP_VERSION "${version}"

#endif
]

#build.sh
under=build
mode=755 // Cool feature: Marks this file as executable!
data=[
#!/bin/bash
echo "Building ${name}..."
gcc ../src/main.c -o ../bin/app
]
